<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>心动消消乐</title>
  <style>
    * { box-sizing: border-box; }
    :root { --ink:#3d2858; --pink:#ff6d9c; --panel:rgba(255,255,255,.84); }
    body {
      margin: 0; min-height: 100vh; overflow-x: hidden; color: var(--ink);
      font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      background:
        radial-gradient(circle at 15% 15%, #fff 0 4%, transparent 24%),
        radial-gradient(circle at 85% 75%, #ffd7e8 0 4%, transparent 28%),
        linear-gradient(145deg,#f8edff,#ffeaf2 52%,#e6f5ff);
      display: grid; place-items: center; padding: 22px 12px;
    }
    body::before, body::after { content:"✦"; position:fixed; color:#fff; opacity:.75; font-size:55px; pointer-events:none; }
    body::before { left:6vw; top:10vh; } body::after { right:7vw; bottom:8vh; }
    .game { width:min(94vw,610px); position:relative; z-index:1; }
    .top { text-align:center; margin-bottom:12px; }
    h1 { margin:0; font-size:clamp(28px,7vw,43px); letter-spacing:3px; text-shadow:0 3px 0 #fff; }
    .subtitle { margin:4px 0 0; color:#8a699c; font-size:14px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:14px 0 10px; }
    .stat { background:var(--panel); border:2px solid #fff; border-radius:16px; padding:9px 5px; text-align:center; box-shadow:0 7px 18px #79548620; }
    .stat small { display:block; color:#9a7ba8; font-size:12px; }
    .stat strong { display:block; font-size:22px; line-height:1.15; }
    .board-wrap { background:rgba(255,255,255,.52); border:3px solid #fff; border-radius:24px; padding:10px; box-shadow:0 16px 42px #5b2a7040; backdrop-filter:blur(8px); }
    #board { display:grid; grid-template-columns:repeat(8,1fr); gap:5px; aspect-ratio:1; }
    .tile { min-width:0; padding:0; border-radius:18%; cursor:pointer; overflow:hidden; position:relative; background:#fff; transition:transform .16s,filter .16s,opacity .2s; box-shadow:0 3px 5px #49335a25; -webkit-tap-highlight-color:transparent; }
    .tile img { width:100%; height:100%; display:block; object-fit:cover; pointer-events:none; }
    .tile.t0 { border:4px solid #1688ff; }
    .tile.t1 { border:4px solid #ff7a18; }
    .tile.t2 { border:4px solid #9b30ff; }
    .tile.t3 { border:4px solid #16b86a; box-shadow:0 0 0 2px #fff,0 0 14px #16b86aaa; }
    .tile.t4 { border:4px solid #f02d4f; box-shadow:0 0 0 2px #fff,0 0 14px #f02d4faa; }
    .tile:hover { transform:translateY(-2px); filter:brightness(1.06); }
    .tile.selected { transform:scale(.88); filter:brightness(1.14); box-shadow:0 0 0 4px #fff,0 0 0 8px #ff4380; z-index:2; }
    .tile.hint { animation:hint .65s ease-in-out 2; }
    .tile.removing { animation:pop .28s forwards; }
    @keyframes pop { to { transform:scale(.05) rotate(16deg); opacity:0; } }
    @keyframes hint { 50% { transform:scale(.84); box-shadow:0 0 0 5px #fff600; } }
    .controls { display:flex; justify-content:center; gap:10px; margin-top:13px; }
    .control { border:0; border-radius:999px; padding:11px 20px; font:700 15px inherit; color:white; cursor:pointer; box-shadow:0 6px 14px #6c3b7c30; }
    #hint { background:#7b5ce1; } #restart { background:linear-gradient(135deg,#ff4f88,#ff8a62); }
    .message { min-height:25px; text-align:center; margin:10px 0 0; font-weight:700; color:#76528b; }
    .overlay { position:fixed; inset:0; z-index:9; display:grid; place-items:center; background:#321d4c99; padding:22px; opacity:0; pointer-events:none; transition:.25s; }
    .overlay.show { opacity:1; pointer-events:auto; }
    .modal { width:min(90vw,360px); padding:30px; text-align:center; background:white; border-radius:26px; box-shadow:0 20px 60px #24103170; }
    .modal h2 { margin:0 0 8px; font-size:31px; } .modal p { margin:5px 0 20px; }
    @media (max-width:480px) { #board{gap:3px}.board-wrap{padding:7px;border-radius:18px}.tile.t0,.tile.t1,.tile.t2{border-width:3px}.stats{margin-top:10px}.game{width:96vw} }
  </style>
</head>
<body>
  <main class="game">
    <header class="top"><h1>心动消消乐</h1><p class="subtitle">交换相邻头像，连成 3 个或更多即可消除</p></header>
    <section class="stats">
      <div class="stat"><small>得分</small><strong id="score">0</strong></div>
      <div class="stat"><small>剩余步数</small><strong id="moves">30</strong></div>
      <div class="stat"><small>剩余时间</small><strong><span id="time">60</span>s</strong></div>
    </section>
    <section class="board-wrap"><div id="board" aria-label="消消乐棋盘"></div></section>
    <div class="controls"><button class="control" id="hint">提示一下</button><button class="control" id="restart">重新开始</button></div>
    <p class="message" id="message">点击一个头像，再点击它旁边的头像</p>
  </main>
  <div class="overlay" id="overlay"><div class="modal"><h2 id="resultTitle">游戏结束</h2><p id="resultText"></p><button class="control" id="again">再玩一次</button></div></div>

    const ROWS=8, COLS=8;
    const boardEl=document.querySelector('#board'), scoreEl=document.querySelector('#score'), movesEl=document.querySelector('#moves'), timeEl=document.querySelector('#time'), messageEl=document.querySelector('#message');
    let board=[], selected=null, score=0, moves=30, time=60, busy=false, ended=false, timer;
    let audioCtx;
    const sleep=ms=>new Promise(r=>setTimeout(r,ms));
    const index=(r,c)=>r*COLS+c;
    const near=(a,b)=>Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1;
    function makeBoard(){
      board=[];
      for(let r=0;r<ROWS;r++){ board[r]=[]; for(let c=0;c<COLS;c++){
        let choices=[0,1,2].filter(t=>!(c>1&&board[r][c-1]===t&&board[r][c-2]===t)&&!(r>1&&board[r-1][c]===t&&board[r-2][c]===t));
        board[r][c]=choices[Math.floor(Math.random()*choices.length)];
      }}
      const spots=[]; while(spots.length<2){ const n=Math.floor(Math.random()*ROWS*COLS); if(!spots.includes(n))spots.push(n); }
      spots.forEach((n,i)=>board[Math.floor(n/COLS)][n%COLS]=3+i);
    }
    function render(){
      boardEl.innerHTML='';
      board.forEach((row,r)=>row.forEach((type,c)=>{
        const b=document.createElement('button'); b.className=`tile t${type}`; b.dataset.r=r; b.dataset.c=c; b.setAttribute('aria-label',type===3?'行列消除道具':type===4?'随机颜色消除道具':`第${r+1}行第${c+1}列`);
        const src=type<3?IMAGES[type]:POWER_IMAGES[type-3],alt=type===3?'行列消除道具':type===4?'随机颜色消除道具':`图案 ${type+1}`;
        b.innerHTML=`<img src="${src}" alt="${alt}">`; boardEl.appendChild(b);
      }));
    }
    function playClearSound(chain=1){
      audioCtx??=new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended')audioCtx.resume();
      const now=audioCtx.currentTime;
      [0,1,2].forEach((step,i)=>{ const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(); osc.type='sine';osc.frequency.setValueAtTime(440+chain*55+step*110,now+i*.055);gain.gain.setValueAtTime(.12,now+i*.055);gain.gain.exponentialRampToValueAtTime(.001,now+i*.055+.16);osc.connect(gain).connect(audioCtx.destination);osc.start(now+i*.055);osc.stop(now+i*.055+.16); });
    }
    function findMatches(){
      const set=new Set();
      for(let r=0;r<ROWS;r++){ let start=0; for(let c=1;c<=COLS;c++) if(c===COLS||board[r][c]!==board[r][start]){ if(board[r][start]<3&&c-start>=3) for(let k=start;k<c;k++) set.add(`${r},${k}`); start=c; } }
      for(let c=0;c<COLS;c++){ let start=0; for(let r=1;r<=ROWS;r++) if(r===ROWS||board[r][c]!==board[start][c]){ if(board[start][c]<3&&r-start>=3) for(let k=start;k<r;k++) set.add(`${k},${c}`); start=r; } }
      return [...set].map(s=>s.split(',').map(Number));
    }
    function swap(a,b){ [board[a.r][a.c],board[b.r][b.c]]=[board[b.r][b.c],board[a.r][a.c]]; }
    async function clickTile(e){
      if(busy||ended)return; const pos={r:+e.currentTarget.dataset.r,c:+e.currentTarget.dataset.c};
      if(board[pos.r][pos.c]>=3){ await activatePower(pos,board[pos.r][pos.c]); return; }
      if(!selected){ selected=pos; e.currentTarget.classList.add('selected'); messageEl.textContent='再选择一个相邻头像'; return; }
      if(selected.r===pos.r&&selected.c===pos.c){ selected=null; render(); return; }
      if(!near(selected,pos)){ selected=pos; render(); boardEl.children[index(pos.r,pos.c)].classList.add('selected'); messageEl.textContent='要选择紧挨着的头像哦'; return; }
      busy=true; const first=selected; selected=null;
      try{
        swap(first,pos); render(); await sleep(160);
        if(!findMatches().length){ swap(first,pos); render(); messageEl.textContent='这一步不能形成三连'; await sleep(180); return; }
        moves--; movesEl.textContent=moves; await settle(); if(moves<=0) finish();
      }finally{ busy=false; }
    }
    async function settle(){
      const matches=findMatches();
      if(matches.length)await clearCells(matches,`消除 ${matches.length} 个！`);
    }
    async function clearCells(cells,label){
      const unique=[...new Map(cells.map(p=>[p.join(','),p])).values()];
      playClearSound(); unique.forEach(([r,c])=>boardEl.children[index(r,c)]?.classList.add('removing')); score+=unique.length*10; scoreEl.textContent=score; messageEl.textContent=label; await sleep(290);
      const marked=new Set(unique.map(([r,c])=>`${r},${c}`));
      for(let c=0;c<COLS;c++){ const kept=[]; for(let r=ROWS-1;r>=0;r--) if(!marked.has(`${r},${c}`)) kept.push(board[r][c]); while(kept.length<ROWS) kept.push(Math.floor(Math.random()*3)); for(let r=ROWS-1,i=0;r>=0;r--,i++) board[r][c]=kept[i]; }
      for(let tries=0,extra=findMatches();extra.length&&tries<100;tries++,extra=findMatches()) extra.forEach(([r,c])=>board[r][c]=Math.floor(Math.random()*3));
      if(findMatches().length)makeBoard();
      render(); await sleep(190);
    }
    async function activatePower(pos,type){
      busy=true; selected=null;
      try{
        let cells=[],label='';
        if(type===3){ for(let c=0;c<COLS;c++)cells.push([pos.r,c]); for(let r=0;r<ROWS;r++)cells.push([r,pos.c]); label='行列道具发动！'; }
        else{ const color=Math.floor(Math.random()*3); for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(board[r][c]===color)cells.push([r,c]); cells.push([pos.r,pos.c]); label=`随机消除图案 ${color+1}！`; }
        moves--; movesEl.textContent=moves; await clearCells(cells,label); if(moves<=0)finish();
      }finally{ busy=false; }
    }
    function getHint(){
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)for(const [dr,dc] of [[0,1],[1,0]]){ const b={r:r+dr,c:c+dc}; if(b.r>=ROWS||b.c>=COLS)continue; const a={r,c}; swap(a,b); const ok=findMatches().length; swap(a,b); if(ok)return[a,b]; }
      return null;
    }
    function showHint(){ if(busy||ended)return; const pair=getHint(); if(!pair){ makeBoard(); render(); messageEl.textContent='棋盘已重新排列'; return; } pair.forEach(p=>boardEl.children[index(p.r,p.c)].classList.add('hint')); messageEl.textContent='试试交换闪烁的两个头像'; }
    function start(){ clearInterval(timer); score=0;moves=30;time=60;selected=null;busy=false;ended=false; scoreEl.textContent=0;movesEl.textContent=30;timeEl.textContent=60;document.querySelector('#overlay').classList.remove('show');messageEl.textContent='点击一个头像，再点击它旁边的头像';makeBoard();render(); timer=setInterval(()=>{ if(busy||ended)return; time--;timeEl.textContent=time;if(time<=0)finish(); },1000); }
    function finish(){ if(ended)return; ended=true;clearInterval(timer);document.querySelector('#resultTitle').textContent=score>=1000?'太厉害了！':'游戏结束';document.querySelector('#resultText').textContent=`最终得分：${score} 分`;document.querySelector('#overlay').classList.add('show'); }
    boardEl.addEventListener('click',e=>{ const tile=e.target.closest('.tile'); if(tile&&boardEl.contains(tile))clickTile({currentTarget:tile}); });
    document.querySelector('#hint').addEventListener('click',showHint);document.querySelector('#restart').addEventListener('click',start);document.querySelector('#again').addEventListener('click',start);start();
  </script>
